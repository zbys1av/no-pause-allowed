[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-video-cutter"
version = "1.3.0"
description = "Local motion-aware video editing for drawing recordings"
requires-python = ">=3.12,<3.14"
dependencies = ["PySide6-Essentials==6.8.3", "PySide6-Addons==6.8.3", "numpy==2.5.4"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pyinstaller==6.22.3"]

[project.scripts]
smart-video-cutter = "smartcut.app:main"

[tool.setuptools.packages.find]
include = ["smartcut*"]

[tool.setuptools.package-data]
smartcut = ["assets/*.svg", "assets/*LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
